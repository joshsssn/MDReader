name: Publier une version

# Compile MDReader.exe et l'extension VS Code, puis crée la release.
# Déclenchement : pousser un tag vX.Y.Z, ou lancer le workflow à la main en donnant le tag
# (il est alors créé sur le commit choisi).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la version à publier (ex. v1.1.0). Vide : compiler sans publier.'
        required: false

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler MDReader.exe
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: target/release/MDReader.exe
          if-no-files-found: error

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust + cible WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire l'extension
        working-directory: vscode
        run: |
          npm install
          npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [exe, vsix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Republier une version existante : l'ancienne release et son tag sont remplacés.
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --yes --cleanup-tag; sleep 5; fi
          gh release create "$TAG" dist/MDReader.exe dist/*.vsix \
            --target "$GITHUB_SHA" \
            --title "MDReader ${TAG#v}" \
            --notes-file docs/release-notes.md
