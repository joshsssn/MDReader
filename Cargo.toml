[package]
name = "mdreader"
version = "1.0.0"
edition = "2021"
description = "MDReader (MDR) — lecteur Markdown portable et rapide pour Windows"
license = "MIT"
repository = "https://github.com/joshsssn/MDReader"
build = "build.rs"

[[bin]]
name = "MDReader"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
wry = "0.57"
tao = "0.37"
rfd = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
windows = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
